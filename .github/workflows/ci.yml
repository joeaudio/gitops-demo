name: CI and image
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Privacy and secure defaults
        run: python3 -m unittest discover -s tests -p 'test_security.py' -v
      - name: Build image for scan
        run: docker build -t vulnerability-drop:ci -f Containerfile .
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: vulnerability-drop:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan repository secrets and configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-setup-trivy: true
  image:
    if: github.event_name == 'push'
    needs: [test, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name image
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
  gitops:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Commit desired image tag
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          python3 scripts/set_image.py "$IMAGE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/k3s/kustomization.yaml
          git commit -m "chore(gitops): deploy ${GITHUB_SHA::12} [skip ci]"
          git push origin HEAD:main
