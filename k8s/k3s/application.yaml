apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vulnerability-drop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/joeaudio/gitops-demo.git
    targetRevision: main
    path: k8s/k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: vulnerability-drop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
